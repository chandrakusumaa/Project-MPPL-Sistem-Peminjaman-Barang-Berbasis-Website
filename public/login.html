<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Organization Inventory</title>
  <link rel="stylesheet" href="css/style.css?v=16.0">
</head>
<body class="guest-body">
  <div class="content-wrapper">
      <!-- BACKGROUND SILUET & VECTOR WATERMARK (Halus, Elegan, 3-4% Opacity) -->
      <div class="bg-siluet-layer" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;">
        <!-- Grid Dot Matrix -->
        <svg style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.035;" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid-dots-dash" width="32" height="32" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="2" r="1.5" fill="#172033" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid-dots-dash)" />
        </svg>

        <!-- Siluet 1: Kamera & Tripod (Kiri Atas Canvas) -->
        <svg style="position: absolute; left: 5%; top: 4rem; width: 22rem; height: 22rem; color: #0f172a; opacity: 0.035; transform: rotate(-6deg);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <circle cx="12" cy="13" r="4" />
          <path d="M12 17v4m-3 0h6m-3-4l-3 4m3-4l3 4" stroke-dasharray="2 2" />
        </svg>

        <!-- Siluet 2: Proyektor & Lensa (Kanan Atas) -->
        <svg style="position: absolute; right: 2%; top: 8rem; width: 22rem; height: 22rem; color: #05214c; opacity: 0.03; transform: rotate(12deg);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="2" y="7" width="20" height="10" rx="2" />
          <circle cx="8" cy="12" r="3" />
          <path d="M16 10h2m-2 4h2" />
          <path d="M6 17l-2 3m14-3l2 3" />
          <path d="M8 9l12-6m-12 12l12 6" stroke-dasharray="1.5 2" opacity="0.6" />
        </svg>

        <!-- Siluet 3: Flight Case / Rak Penyimpanan Aset (Tengah Bawah) -->
        <svg style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 2rem; width: 36rem; height: 14rem; color: #1e293b; opacity: 0.025;" viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="0.8">
          <rect x="10" y="8" width="80" height="26" rx="3" />
          <line x1="10" y1="18" x2="90" y2="18" stroke-dasharray="2 2" />
          <rect x="44" y="14" width="12" height="8" rx="1.5" />
          <circle cx="20" cy="18" r="2" />
          <circle cx="80" cy="18" r="2" />
          <line x1="30" y1="8" x2="30" y2="34" />
          <line x1="70" y1="8" x2="70" y2="34" />
        </svg>

        <!-- Ambient Glow Merah Lembut -->
        <div class="ambient-glow" style="top: 2rem; opacity: 0.6;"></div>
      </div>

    <div style="display: flex; justify-content: center; margin-top: 1rem; margin-bottom: 2rem;">
      <a href="index.html" class="brand-logo" style="display: inline-flex; justify-content: center;">
          <img src="images/logo.png" alt="Organization Inventory" class="app-logo" style="height: 42px; width: auto; object-fit: contain;">
        </a>
    </div>

    <div style="max-width: 26rem; margin: 0 auto; background: #ffffff;  border-radius: 1.5rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);">
      <h1 style="font-size: 1.5rem; font-weight: 900; color: var(--oi-black); letter-spacing: -0.03em; margin-bottom: 0.25rem;">Selamat Datang</h1>
      <p style="font-size: 0.8125rem; color: var(--oi-muted); margin-bottom: 1.5rem;">Masuk ke akun Anda untuk mengelola komunitas & peminjaman.</p>

      <div id="authAlertBanner" style="display: none; background: #fdf2f4; border: 1px solid #fecdd6; color: #05214c; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.8125rem; font-weight: 600; margin-bottom: 1.25rem;"></div>

      <form onsubmit="loginUser(event)">
        <div class="form-group">
          <label class="form-label">Alamat Email</label>
          <input type="email" class="form-input" value="wildan@orginventory.id" required>
        </div>
        
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
            <label class="form-label" style="margin-bottom: 0;">Kata Sandi</label>
            <a href="forgot-password.html" style="font-size: 0.75rem; color: var(--oi-red); text-decoration: none; font-weight: 700;">Lupa Sandi?</a>
          </div>
          <input type="password" class="form-input" value="••••••••" required>
        </div>

        <button type="submit" class="pill-btn btn-primary-red btn-lg" style="width: 100%; margin-top: 0.5rem; justify-content: center; font-weight: 800;">
          Masuk ke Akun <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- 1-CLICK DEMO LOGIN (ADMIN & MEMBER) -->
      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #f1f5f9; text-align: center;">
        <span style="font-size: 0.6875rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em;">Masuk Cepat Demo (1-Click)</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; margin-top: 0.75rem;">
          <button type="button" onclick="quickLoginDemo('member')" class="pill-btn btn-secondary-light btn-sm" style="font-size: 0.75rem; justify-content: center; padding: 0.5rem; border: 1px solid #cbd5e1; font-weight: 700;">
            Demo Member
          </button>
          <button type="button" onclick="quickLoginDemo('admin')" class="pill-btn btn-solid-black btn-sm" style="font-size: 0.75rem; justify-content: center; padding: 0.5rem; font-weight: 700;">
            Demo Admin
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem; color: #64748b;">
        Belum memiliki akun? <a href="register.html" style="color: var(--oi-black); font-weight: 800; text-decoration: none;">Daftar gratis</a>
      </div>
    </div>
  </div>
  <script src="js/app.js?v=16.0"></script>
  <script>
    function loginUser(event) {
      if (event) event.preventDefault();
      localStorage.setItem('user_token', 'demo-session-token-valid');
      localStorage.setItem('user_name', 'Wildan Amal');
      localStorage.setItem('user_email', 'wildan@orginventory.id');
      showToast('Masuk berhasil! Mengalihkan ke Dashboard...', 'success');
      setTimeout(() => {
        window.location.href = 'user-dashboard.html';
      }, 400);
    }

    function quickLoginDemo(role) {
      localStorage.setItem('user_token', 'demo-session-token-valid');
      if (role === 'admin') {
        localStorage.setItem('user_role', 'ADMIN');
        showToast('Masuk sebagai Admin Komunitas (Media Kreatif Lab)...', 'success');
        setTimeout(() => {
          window.location.href = 'workspace.html?org=1&role=admin';
        }, 400);
      } else {
        localStorage.setItem('user_role', 'MEMBER');
        showToast('Masuk sebagai Member Aktif...', 'success');
        setTimeout(() => {
          window.location.href = 'user-dashboard.html';
        }, 400);
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const alertBox = document.getElementById('authAlertBanner');
      if (!alertBox) return;
      if (params.get('reason') === 'required') {
        alertBox.textContent = 'Silakan masuk terlebih dahulu untuk mengakses halaman tersebut.';
        alertBox.style.display = 'block';
      } else if (params.get('reason') === 'logout') {
        alertBox.textContent = 'Anda telah berhasil keluar dari akun.';
        alertBox.style.display = 'block';
        alertBox.style.background = '#f1f5f9';
        alertBox.style.borderColor = '#e2e8f0';
        alertBox.style.color = '#334155';
      }
    });
  </script>
</body>
</html>
